[project]
name = "pharmomics"
version = "0.1.0"
description = "Human-in-the-loop research assistant for drug-response transcriptomics"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "chplyn14-wq"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "transcriptomics",
    "drug-discovery",
    "gene-expression",
    "scientific-research",
]

dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "pandas>=2",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/chplyn14-wq/PharmOmics-Agent"
Repository = "https://github.com/chplyn14-wq/PharmOmics-Agent"
Issues = "https://github.com/chplyn14-wq/PharmOmics-Agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
pharmomics = "pharmomics.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
